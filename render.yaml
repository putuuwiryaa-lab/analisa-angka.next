services:
  - type: web
    name: analisa-angka-next
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm start
    autoDeployTrigger: commit
    healthCheckPath: /pin
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ACCESS_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
