name: Apply NumberField Escape fix

on:
  push:
    branches:
      - agent/fix-number-field-escape

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-number-field-escape
          fetch-depth: 0

      - name: Patch NumberField components
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          def patch_number_field(path: str, add_use_ref: bool = False) -> None:
              file = Path(path)
              text = file.read_text()

              if add_use_ref:
                  text = replace_once(
                      text,
                      'import { useEffect, useMemo, useState, type ChangeEvent, type ReactNode } from "react";',
                      'import { useEffect, useMemo, useRef, useState, type ChangeEvent, type ReactNode } from "react";',
                      f"{path} import",
                  )

              marker = "function NumberField("
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"{path}: NumberField not found")

              prefix = text[:start]
              block = text[start:]

              block = replace_once(
                  block,
                  '  const [draft, setDraft] = useState(String(value));\n',
                  '  const [draft, setDraft] = useState(String(value));\n  const cancelBlurRef = useRef(false);\n',
                  f"{path} cancel ref",
              )

              block = replace_once(
                  block,
                  '          onBlur={commit}\n',
                  '          onBlur={() => {\n            if (cancelBlurRef.current) {\n              cancelBlurRef.current = false;\n              setDraft(String(value));\n              return;\n            }\n            commit();\n          }}\n',
                  f"{path} blur handler",
              )

              block = replace_once(
                  block,
                  '            if (event.key === "Escape") {\n              setDraft(String(value));\n              event.currentTarget.blur();\n            }',
                  '            if (event.key === "Escape") {\n              cancelBlurRef.current = true;\n              setDraft(String(value));\n              event.currentTarget.blur();\n            }',
                  f"{path} escape handler",
              )

              file.write_text(prefix + block)

          patch_number_field("app/scan/_components/ScanFields.tsx")
          patch_number_field("app/scan/batch/page.tsx", add_use_ref=True)
          Path(".github/workflows/fix-number-field-escape.yml").unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/scan/_components/ScanFields.tsx app/scan/batch/page.tsx .github/workflows/fix-number-field-escape.yml
          git commit -m "Fix NumberField Escape cancellation"
          git push origin HEAD:agent/fix-number-field-escape
