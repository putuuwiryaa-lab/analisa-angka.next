name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_ADMIN_CONTACT_URL: https://example.com/contact
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      ACCESS_SECRET: ci-access-secret-at-least-32-characters
      ADMIN_PASSWORD: ci-admin-password
      INTERNAL_API_SECRET: ci-internal-api-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('deno.json', 'package.json') }}

      - name: Install dependencies
        run: deno install --allow-scripts

      - name: Lint
        run: deno task lint

      - name: Typecheck
        run: deno task typecheck

      - name: Unit tests
        run: deno task test

      - name: Production build
        run: deno task build
